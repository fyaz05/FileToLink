[project]
name = "thunder-filetolink"
version = "2.2.0"
description = "FileToLink — Telegram file-to-link streaming bot (pyrofork + aiohttp + MongoDB)"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.3",           # OSV-clean; 3 Jan-2026 CVEs fixed (H1)
    "pyrofork==2.3.69",
    "tgcrypto-pyrofork==1.2.8",  # H1: maintained crypto backend (pyrofork[speedup])
    "pymongo==4.18.0",           # async AsyncMongoClient; >= 4.9 for timeoutMS
    "Jinja2==3.1.6",
    "python-dotenv==1.2.3",
    "psutil==7.2.2",
    "uvloop==0.22.1",            # py3.13 support (was pinned 0.21.0)
]

[project.optional-dependencies]
# H5b/R8: escape hatch for Cloudflare-protected shortener providers.
# Never installed by default; shortener falls back to plain aiohttp.
shortener-cf = ["curl_cffi>=0.7"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "vulture>=2.14",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines: message templates
    "SIM105", # try/except/pass is idiomatic around best-effort teardown here
    "UP047",  # keep TypeVar generics (readable for this codebase)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, hermetic tests (no network, no Mongo)",
    "integration: testcontainers-backed tests (opt-in, see tests/integration)",
]
addopts = "-m unit --cov=Thunder --cov-report=term-missing --cov-fail-under=35"

[tool.coverage.run]
source = ["Thunder"]
omit = ["Thunder/bot/plugins/*", "Thunder/__main__.py"]

[tool.vulture]
min_confidence = 80
paths = ["Thunder", "whitelist.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
