# Tool configuration only: the app is not a distributable package, so there is
# no [project] table. One config file for both tools.

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
# E4 stays out on purpose: __main__.py imports after creating the event loop,
# which Pyrogram requires, so its E402 findings are all intentional.
select = ["E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning",
]
addopts = "-ra"
