[project]
name = "thunder-filetolink"
version = "2.2.0"
description = "FileToLink — Telegram file-to-link streaming bot (pyrofork + aiohttp + MongoDB)"
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.3",           # OSV-clean; 3 2026 CVEs fixed (Aug-2026 advisory cycle) (H1)
    "pyrofork==2.3.69",           # latest; upstream quiet since 2025-12 -- watch for Telegram API drift
    "tgcrypto-pyrofork==1.2.8",  # H1: maintained crypto backend (pyrofork[speedup])
    "pymongo==4.18.0",           # async AsyncMongoClient; timeoutMS since 4.2
    "Jinja2==3.1.6",
    "python-dotenv==1.2.3",
    "psutil==7.2.2",
    "uvloop==0.22.1",            # py3.13 support
]

[dependency-groups]
dev = [
    "pytest>=8.4",   # pytest-asyncio 1.4 requires >=8.4
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "vulture>=2.14",
    "pip-audit>=2.7",
    # Integration tier only (tests/integration): real MongoDB via Docker.
    # >=4.15: tests import testcontainers.community.mongodb (moved in 4.15).
    "testcontainers[mongodb]>=4.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines: message templates
    "SIM105", # try/except/pass is idiomatic around best-effort teardown here
    "UP047",  # keep TypeVar generics (readable for this codebase)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, hermetic tests (no network, no Mongo)",
    "integration: testcontainers-backed tests (opt-in, see tests/integration)",
]
addopts = "-m unit"
# Coverage flags are passed by `make test`/CI so the opt-in integration tier
# (`pytest -m integration`) runs without the unit tier's --cov-fail-under threshold.

[tool.coverage.run]
source = ["Thunder"]
omit = ["Thunder/bot/plugins/*", "Thunder/__main__.py"]

[tool.vulture]
min_confidence = 80
paths = ["Thunder"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
