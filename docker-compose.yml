# Local dev stack: app + MongoDB for manual testing.
# Unit/integration tiers use testcontainers instead; this file is for humans.
# Needs config.env next to this file (copy config_sample.env first).
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    # SIGKILL before shutdown finishes skips the touch flush, so give the
    # 45 s budget in Thunder/__main__.py room to complete
    stop_grace_period: 60s
    volumes:
      # /log tails this file; without a volume it dies with the container
      - app-logs:/app/Thunder/logs
    # NOTE: every key here lands in the real environment, which outranks
    # config.env.local -- drop this block if you rely on local overrides
    env_file:
      - config.env
    environment:
      DATABASE_URL: mongodb://mongo:27017/thunder
      # BIND_ADDRESS / PORT come from config.env; keep PORT=8080 here.

volumes:
  mongo-data:
  app-logs:
